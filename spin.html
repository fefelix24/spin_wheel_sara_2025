<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Spin Button</title>
</head>
<body>

  <!-- SPIN button -->
  <button onclick="spin()" style="font-size:30px;padding:20px;margin-right:20px;">
    SPIN
  </button>

  <!-- NUMBER button -->
  <button onclick="addNumber1()" style="font-size:30px;padding:20px;">
    +1 NUMBER [1]
  </button>
  <button onclick="subbNumber1()" style="font-size:30px;padding:20px;">
    -1 NUMBER [1]
  </button>
  <button onclick="addNumber2()" style="font-size:30px;padding:20px;">
    +1 NUMBER [2]
  </button>
  <button onclick="subbNumber2()" style="font-size:30px;padding:20px;">
    -1 NUMBER [2]
  </button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAs71QMd4IrDUP3sYYgcQ_AWL6C-kygmiM",
      authDomain: "shared-wheel-sara-2025.firebaseapp.com",
      databaseURL: "https://shared-wheel-sara-2025-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "shared-wheel-sara-2025",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let number1 = 0;
    let number2 = 0;

    // Spin button function
    window.spin = function () {
      set(ref(db, "spin"), {
        seed: Math.random(),
        time: Date.now()
      });
    };

    // Number button function
    window.addNumber1 = function () {
      number1++;
      set(ref(db, "number1"), {
        value: number1,
        time: Date.now()
      });
    };
    window.subbNumber1 = function () {
      number1--;
      set(ref(db, "number1"), {
        value: number1,
        time: Date.now()
      });
    };
    window.addNumber2 = function () {
      number2++;
      set(ref(db, "number2"), {
        value: number2,
        time: Date.now()
      });
    };
    window.subbNumber2 = function () {
      number2--;
      set(ref(db, "number2"), {
        value: number2,
        time: Date.now()
      });
    };
  </script>

</body>
</html>
