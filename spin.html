<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Spin Button</title>
  <style>
    body {
      background: black;
      color: white;
      font-family: Arial, sans-serif;
    }
    button {
      font-size: 30px;
      padding: 20px;
      margin: 10px;
      cursor: pointer;
    }
    input {
      font-size: 24px;
      padding: 10px;
      width: 400px;
      margin: 10px;
    }
    hr {
      margin: 40px 0;
    }
  </style>
</head>
<body>

  <!-- SPIN -->
  <button onclick="spin()">SPIN</button>

  <br><br>

  <!-- DRINK COUNTER -->
  <button onclick="addNumber1()">+1 NUMBER [DRAGIRA]</button>
  <button onclick="subbNumber1()">-1 NUMBER [DRAGIRA]</button>

  <br>

  <!-- SECOND COUNTER -->
  <button onclick="addNumber2()">+1 NUMBER [SHARA]</button>
  <button onclick="subbNumber2()">-1 NUMBER [SHARA]</button>

  <hr>

  <!-- FALSCHES WORT -->
  <button onclick="addFalschesWort()">+1 FALSCHES WORT</button>
  <button onclick="subbFalschesWort()">-1 FALSCHES WORT</button>
  <button onclick="resetFalschesWort()">RESET FALSCHES WORT</button>

  <hr>

  <!-- TEXT CONTROL -->
  <input id="textInput" placeholder="Enter wheel text here">
  <br>
  <button onclick="updateText()">UPDATE WHEEL TEXT</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAs71QMd4IrDUP3sYYgcQ_AWL6C-kygmiM",
      authDomain: "shared-wheel-sara-2025.firebaseapp.com",
      databaseURL: "https://shared-wheel-sara-2025-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "shared-wheel-sara-2025",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let number1 = 0;
    let number2 = 0;
    let falschesWort = 0;

    // SPIN
    window.spin = function () {
      set(ref(db, "spin"), {
        seed: Math.random(),
        time: Date.now()
      });
    };

    // NUMBER 1
    window.addNumber1 = function () {
      number1++;
      set(ref(db, "number1"), { value: number1 });
    };
    window.subbNumber1 = function () {
      number1--;
      set(ref(db, "number1"), { value: number1 });
    };

    // NUMBER 2
    window.addNumber2 = function () {
      number2++;
      set(ref(db, "number2"), { value: number2 });
    };
    window.subbNumber2 = function () {
      number2--;
      set(ref(db, "number2"), { value: number2 });
    };

    // FALSCHES WORT
    window.addFalschesWort = function () {
      falschesWort++;
      set(ref(db, "falschesWort"), { value: falschesWort });
    };
    window.subbFalschesWort = function () {
      falschesWort--;
      set(ref(db, "falschesWort"), { value: falschesWort });
    };
    window.resetFalschesWort = function () {
      falschesWort = 0;
      set(ref(db, "falschesWort"), { value: falschesWort });
    };

    // TEXT CONTROL
    window.updateText = function () {
      const text = document.getElementById("textInput").value;
      set(ref(db, "text/message"), text);
    };
  </script>

</body>
</html>
