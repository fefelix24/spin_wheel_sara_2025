<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Number Display</title>
  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-size: 150px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

  <div id="number">0</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAs71QMd4IrDUP3sYYgcQ_AWL6C-kygmiM",
      authDomain: "shared-wheel-sara-2025.firebaseapp.com",
      databaseURL: "https://shared-wheel-sara-2025-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "shared-wheel-sara-2025",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const numberDiv = document.getElementById("number");

    // Listen for changes in the "number" node
    onValue(ref(db, "number"), (snapshot) => {
      const data = snapshot.val();
      if (!data) return;
      numberDiv.textContent = data.value;
    });
  </script>

</body>
</html>
