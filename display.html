<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Number Display</title>
  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      flex-direction: column;
    }

    /* Title */
    #title {
      font-size: 64px;
      margin-bottom: 40px;
      text-align: center;
    }

    .number-container {
      display: flex;
      gap: 120px;
      align-items: flex-start;
    }

    .number-block {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .number-block img {
      width: 150px;
      height: auto;
      margin-bottom: 20px;
    }

    .number {
      font-size: 150px;
    }

    .sub-label {
      margin-top: 30px;
      font-size: 32px;
    }

    .sub-number {
      font-size: 80px;
    }

    /* Glow animation */
    @keyframes pulseGlow {
      0% {
        text-shadow: none;
        transform: scale(1);
      }
      50% {
        text-shadow:
          0 0 20px rgba(255,255,255,0.8),
          0 0 40px rgba(255,255,255,0.6);
        transform: scale(1.05);
      }
      100% {
        text-shadow: none;
        transform: scale(1);
      }
    }

    .glow {
      animation: pulseGlow 0.6s ease-out;
    }
  </style>
</head>
<body>

  <div id="title">DRINK COUNTER</div>

  <div class="number-container">
    <!-- DRINK COUNTER + Falsches Wort -->
    <div class="number-block">
      <img src="image1.png" alt="Drink">
      <div id="number1" class="number">0</div>

      <div class="sub-label">Falsches Wort</div>
      <div id="falschesWort" class="sub-number">0</div>
    </div>

    <!-- SECOND MAIN COUNTER -->
    <div class="number-block">
      <img src="image2.png" alt="Other">
      <div id="number2" class="number">0</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAs71QMd4IrDUP3sYYgcQ_AWL6C-kygmiM",
      authDomain: "shared-wheel-sara-2025.firebaseapp.com",
      databaseURL: "https://shared-wheel-sara-2025-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "shared-wheel-sara-2025",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const number1Div = document.getElementById("number1");
    const number2Div = document.getElementById("number2");
    const falschesWortDiv = document.getElementById("falschesWort");

    function updateNumber(el, value) {
      el.textContent = value;
      el.classList.remove("glow");
      void el.offsetWidth;
      el.classList.add("glow");
    }

    onValue(ref(db, "number1"), (snapshot) => {
      const data = snapshot.val();
      if (!data) return;
      updateNumber(number1Div, data.value);
    });

    onValue(ref(db, "number2"), (snapshot) => {
      const data = snapshot.val();
      if (!data) return;
      updateNumber(number2Div, data.value);
    });

    onValue(ref(db, "falschesWort"), (snapshot) => {
      const data = snapshot.val();
      if (!data) return;
      updateNumber(falschesWortDiv, data.value);
    });
  </script>

</body>
</html>
