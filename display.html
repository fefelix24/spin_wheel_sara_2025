<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Number Display</title>
  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    .number-container {
      display: flex;
      gap: 100px; /* Space between the two numbers */
      align-items: flex-start;
    }

    .number-block {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .number-block img {
      width: 150px; /* Image size */
      height: auto;
      margin-bottom: 20px;
    }

    .number {
      font-size: 150px;
    }
  </style>
</head>
<body>

  <div class="number-container">
    <!-- First number -->
    <div class="number-block">
      <img src="image1.png" alt="Image 1">
      <div id="number1" class="number">0</div>
    </div>

    <!-- Second number -->
    <div class="number-block">
      <img src="image2.png" alt="Image 2">
      <div id="number2" class="number">0</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAs71QMd4IrDUP3sYYgcQ_AWL6C-kygmiM",
      authDomain: "shared-wheel-sara-2025.firebaseapp.com",
      databaseURL: "https://shared-wheel-sara-2025-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "shared-wheel-sara-2025",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const number1Div = document.getElementById("number1");
    const number2Div = document.getElementById("number2");

    // Listen for first number
    onValue(ref(db, "number1"), (snapshot) => {
      const data = snapshot.val();
      if (!data) return;
      number1Div.textContent = data.value;
    });

    // Listen for second number
    onValue(ref(db, "number2"), (snapshot) => {
      const data = snapshot.val();
      if (!data) return;
      number2Div.textContent = data.value;
    });

  </script>

</body>
</html>
