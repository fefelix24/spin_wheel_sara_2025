<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: transparent; }
    #wheel { transition: transform 4s ease-out; }
  </style>
</head>
<body>

<img id="wheel" src="wheel.png" width="400">

<script type="module">
  // Firebase imports
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAs71QMd4IrDUP3sYYgcQ_AWL6C-kygmiM",
    authDomain: "shared-wheel-sara-2025.firebaseapp.com",
    databaseURL: "https://shared-wheel-sara-2025-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "shared-wheel-sara-2025",
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const wheel = document.getElementById("wheel");

let currentRotation = 0;
let firstLoad = true;

onValue(ref(db, "spin"), (snapshot) => {
  const data = snapshot.val();
  if (!data) return;

  // Prevent spinning on page load
  if (firstLoad) {
    firstLoad = false;
    return;
  }

  const seed = data.seed;

  // Always ADD rotation
  currentRotation += 360 * 5 + seed * 360;

  wheel.style.transform = `rotate(${currentRotation}deg)`;
});

</script>

</body>
</html>
