<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Wheel Display</title>
  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
      font-family: Arial, sans-serif;
    }

    #wheel-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #wheel-wrapper {
      position: relative;
    }

    #wheel {
      width: 400px;
      transition: transform 4s ease-out;
    }

    /* Triangle pointer on RIGHT, pointing LEFT */
    #pointer {
      width: 0;
      height: 0;
      border-top: 25px solid transparent;
      border-bottom: 25px solid transparent;
      border-right: 50px solid red;
      position: absolute;
      top: 50%;
      right: -50px;
      transform: translateY(-50%);
      z-index: 10;
    }

    /* Text below the wheel */
    #customText {
      margin-top: 30px;
      font-size: 48px;
      color: white;
      text-align: center;
      max-width: 600px;
    }
  </style>
</head>
<body>

  <div id="wheel-container">
    <div id="wheel-wrapper">
      <div id="pointer"></div>
      <img id="wheel" src="wheel.png">
    </div>

    <!-- Custom text from database -->
    <div id="customText"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAs71QMd4IrDUP3sYYgcQ_AWL6C-kygmiM",
      authDomain: "shared-wheel-sara-2025.firebaseapp.com",
      databaseURL: "https://shared-wheel-sara-2025-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "shared-wheel-sara-2025",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const wheel = document.getElementById("wheel");
    const customText = document.getElementById("customText");

    let currentRotation = 0;
    let firstLoad = true;

    // Wheel spin listener
    onValue(ref(db, "spin"), (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      if (firstLoad) {
        firstLoad = false;
        return;
      }

      const seed = data.seed;
      currentRotation += 360 * 5 + seed * 360;
      wheel.style.transform = `rotate(${currentRotation}deg)`;
    });

    // Custom text listener
    onValue(ref(db, "text/message"), (snapshot) => {
      const value = snapshot.val();
      customText.textContent = value || "";
    });
  </script>

</body>
</html>
