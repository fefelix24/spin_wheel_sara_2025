<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Wheel Display</title>
  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    #wheel-container {
      position: relative;
    }
    #wheel {
      width: 400px;
      position: relative;
      transition: transform 4s ease-out;
    }
    /* Triangle pointer pointing downward */
    #pointer {
      width: 0;
      height: 0;
      border-left: 25px solid transparent;
      border-right: 25px solid transparent;
      border-top: 50px solid red; /* Changed to border-top for downward pointer */
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="wheel-container">
    <!-- Triangle pointer -->
    <div id="pointer"></div>

    <!-- Wheel image -->
    <img id="wheel" src="wheel.png">
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAs71QMd4IrDUP3sYYgcQ_AWL6C-kygmiM",
      authDomain: "shared-wheel-sara-2025.firebaseapp.com",
      databaseURL: "https://shared-wheel-sara-2025-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "shared-wheel-sara-2025",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const wheel = document.getElementById("wheel");

    let currentRotation = 0;
    let firstLoad = true;

    // Listen for spin changes
    onValue(ref(db, "spin"), (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      if (firstLoad) {
        firstLoad = false;
        return; // Ignore initial load
      }

      const seed = data.seed;
      currentRotation += 360 * 5 + seed * 360;
      wheel.style.transform = `rotate(${currentRotation}deg)`;
    });

  </script>

</body>
</html>
